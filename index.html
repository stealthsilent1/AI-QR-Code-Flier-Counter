<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>One moment&hellip;</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f6f2;
      --fg: #1f2328;
      --muted: #59636e;
      --card: #ffffff;
      --accent: #2f6f4f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --fg: #e6e9ec;
        --muted: #9aa4ae;
        --card: #1e2327;
        --accent: #6fbf94;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      padding: 1.5rem;
    }
    main {
      max-width: 34rem;
      background: var(--card);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.9rem;
      color: var(--accent);
    }
    p, li { line-height: 1.6; color: var(--muted); }
    ul { list-style: none; padding: 0; text-align: left; display: inline-block; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">One moment&hellip;</h1>
    <p id="msg">Sending you on your way.</p>
    <ul id="links" hidden></ul>
    <noscript>
      <p>JavaScript is off, so we can't forward you automatically.
         Please type the address printed on the flyer into your browser.</p>
    </noscript>
  </main>

  <script>
    /* ================================================================
       All QR codes live in codes.json (500 slots, qr-001 … qr-500),
       edited through manager.html — you never need to touch this file.

       Each printed QR code points at THIS page with its ID:

         https://stealthsilent1.github.io/AI-QR-Code-Flier-Counter/?src=qr-001

       This page counts the scan in GoatCounter, then forwards the
       visitor to the code's destination from codes.json. Because the
       printed code points here (not at the destination), you can change
       any code's destination later WITHOUT reprinting flyers.
       ================================================================ */

    /* Your GoatCounter endpoint (dashboard: https://stealthsilent.goatcounter.com) */
    var GOATCOUNTER = "https://stealthsilent.goatcounter.com/count";

    var tag = new URLSearchParams(location.search).get("src") || "";

    fetch("codes.json")
      .then(function (r) { return r.json(); })
      .catch(function () { return null; })
      .then(function (codes) {
        var entry = codes && codes[tag];
        var dest = (entry && entry.status !== "retired" && entry.dest) || "";

        /* Record the scan as a pageview named after the ID, e.g. "/qr-001".
           Unknown, unassigned, or retired codes are still counted, under
           "/untagged/...", so no scan is ever lost silently. */
        var path = "/" + (dest ? tag : "untagged/" + (tag || "none"));
        var done = false;
        function redirect() {
          if (done) return;
          done = true;
          if (dest) location.replace(dest);
        }
        var pixel = new Image();
        pixel.onload = redirect;   /* count confirmed -> go */
        pixel.onerror = redirect;  /* counting must never strand the visitor */
        pixel.src = GOATCOUNTER + "?p=" + encodeURIComponent(path);
        setTimeout(redirect, 1500);

        if (dest) {
          document.getElementById("msg").innerHTML =
            'If nothing happens, <a href="' + dest + '">tap here</a>.';
        } else {
          /* No usable code: list the distinct destinations instead. */
          document.getElementById("title").textContent = "Hmm, that code isn't set up yet.";
          document.getElementById("msg").textContent = "Here's where our other codes lead:";
          var list = document.getElementById("links");
          list.hidden = false;
          var seen = {};
          Object.keys(codes || {}).forEach(function (id) {
            var d = codes[id].dest;
            if (!d || codes[id].status === "retired" || seen[d]) return;
            seen[d] = true;
            var li = document.createElement("li");
            var a = document.createElement("a");
            a.href = d;
            a.textContent = d;
            li.appendChild(a);
            list.appendChild(li);
          });
        }
      });
  </script>
</body>
</html>
