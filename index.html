<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>One moment&hellip;</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f6f2;
      --fg: #1f2328;
      --muted: #59636e;
      --card: #ffffff;
      --accent: #2f6f4f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --fg: #e6e9ec;
        --muted: #9aa4ae;
        --card: #1e2327;
        --accent: #6fbf94;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      padding: 1.5rem;
    }
    main {
      max-width: 34rem;
      background: var(--card);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.9rem;
      color: var(--accent);
    }
    p, li { line-height: 1.6; color: var(--muted); }
    ul { list-style: none; padding: 0; text-align: left; display: inline-block; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">One moment&hellip;</h1>
    <p id="msg">Sending you on your way.</p>
    <ul id="links" hidden></ul>
    <noscript>
      <p>JavaScript is off, so we can't forward you automatically.
         Please type the address printed on the flyer into your browser.</p>
    </noscript>
  </main>

  <script>
    /* ================================================================
       EDIT THIS MAP — everything else can be left alone.

       Each flyer batch gets a tag (left side) and the website its QR
       code should send people to (right side). The QR code for a batch
       points at THIS page with its tag:

         https://stealthsilent1.github.io/AI-QR-Code-Flier-Counter/?src=pauseai-library

       This page counts the scan in GoatCounter, then forwards the
       visitor to the destination. Because the printed code points here
       (not at the destination), you can change a destination below at
       any time WITHOUT reprinting flyers.
       ================================================================ */
    var DESTINATIONS = {
      "pauseai-library":    "https://pauseai.info",
      "pauseai-coffeeshop": "https://pauseai.info",
      "example-batch":      "https://example.org"
    };

    /* Your GoatCounter endpoint (dashboard: https://stealthsilent.goatcounter.com) */
    var GOATCOUNTER = "https://stealthsilent.goatcounter.com/count";

    var tag  = new URLSearchParams(location.search).get("src") || "";
    var dest = DESTINATIONS[tag];

    /* Record the scan as a pageview named after the tag, e.g. "/pauseai-library".
       Unknown or missing tags are still counted, under "/untagged/...", so a
       typo on a printed flyer never loses scans silently. */
    var path = "/" + (dest ? tag : "untagged/" + (tag || "none"));
    var counted = false;
    function redirect() {
      if (counted) return;
      counted = true;
      if (dest) location.replace(dest);
    }
    var pixel = new Image();
    pixel.onload = redirect;   /* count confirmed -> go */
    pixel.onerror = redirect;  /* counting must never strand the visitor */
    pixel.src = GOATCOUNTER + "?p=" + encodeURIComponent(path);
    setTimeout(redirect, 1500);

    if (dest) {
      document.getElementById("msg").innerHTML =
        'If nothing happens, <a href="' + dest + '">tap here</a>.';
    } else {
      /* No valid tag: show all known destinations instead of redirecting. */
      document.getElementById("title").textContent = "Hmm, that code isn't set up yet.";
      document.getElementById("msg").textContent = "Here's where our other codes lead:";
      var list = document.getElementById("links");
      list.hidden = false;
      Object.keys(DESTINATIONS).forEach(function (t) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = DESTINATIONS[t];
        a.textContent = DESTINATIONS[t];
        li.appendChild(a);
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
